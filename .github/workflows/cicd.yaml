name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_TRAIN: ghcr.io/${{ github.repository }}-train
  IMAGE_NAME_API: ghcr.io/${{ github.repository }}-api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - run: pip install ruff
      - run: ruff check src/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - run: pip install pytest
      - run: PYTHONPATH=src pytest src/tests/ -v

  train-and-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5 
        
      - name: Run DVC Pipeline
        run: uv run dvc repro

  build-push:
    runs-on: ubuntu-latest
    needs: train-and-gate
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Image Names
        run: |
          echo "IMAGE_NAME_TRAIN=${IMAGE_NAME_TRAIN,,}" >> $GITHUB_ENV
          echo "IMAGE_NAME_API=${IMAGE_NAME_API,,}" >> $GITHUB_ENV

      - name: Build and Push Images
        run: |
          TAG=sha-${{ github.sha }}
          docker build --build-arg GIT_COMMIT=${{ github.sha }} -f docker/Dockerfile -t $IMAGE_NAME_TRAIN:$TAG .
          docker push $IMAGE_NAME_TRAIN:$TAG
          
          docker build -f docker/Dockerfile.api -t $IMAGE_NAME_API:$TAG .
          docker push $IMAGE_NAME_API:$TAG
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Update K8s Manifest
        run: |
          sed -i "s|image:.*u2-api:.*|image: ${IMAGE_NAME_API}:${IMAGE_TAG}|" k8s/inference.yaml

          sed -i "s|image:.*|image: ${IMAGE_NAME_TRAIN}:${IMAGE_TAG}|" k8s/train-job.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s/inference.yaml k8s/train-job.yaml
          
          # Only commit if there's actually a change (prevents errors)
          git diff --staged --quiet || git commit -m "cd: bump images to ${IMAGE_TAG}"
          
          git push