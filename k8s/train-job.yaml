apiVersion: batch/v1
kind: Job
metadata:
  name: train-job
  namespace: mlops
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: ghcr.io/matas34/mlops_u-train:sha-bb51fdae51c0eca42dca889e19837c16159393b7
          command: ["sh", "-c", "python src/prepare.py && python src/hpo.py && python src/train.py && python src/evaluate.py"]
          envFrom:
            - configMapRef: { name: train-config }