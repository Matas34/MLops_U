apiVersion: batch/v1
kind: Job
metadata:
  name: train-job
  namespace: mlops
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: ghcr.io/matas/u1:sha-08531e5
          command: ["sh", "-c", "python src/prepare.py && python src/hpo.py && python src/train.py && python src/evaluate.py"]
          envFrom:
            - configMapRef: { name: train-config }