apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-api
  namespace: mlops
spec:
  selector:
    matchLabels:
      app: model-api
  template:
    metadata:
      labels:
        app: model-api
    spec:
      containers:
        - name: api
          image: ghcr.io/matas34/mlops_u-api:sha-f65306d76741627777bdc96f791278899343baf1
          imagePullPolicy: IfNotPresent
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.mlops.svc.cluster.local:5000"