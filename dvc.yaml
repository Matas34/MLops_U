stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
    params:
      - params.yaml:
    outs:
      - data/raw/data.csv
  hpo:
    cmd: python src/hpo.py
    deps: 
      - src/hpo.py
      - data/raw/data.csv
    params: 
      - params.yaml:
    outs: 
      - best_params.yaml
  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/raw/data.csv
    params:
      - best_params.yaml:
    outs:
      - models/model.pkl
      - models/run_id.txt:
          cache: false
  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/model.pkl
    metrics:
      - metrics.json:
          cache: false